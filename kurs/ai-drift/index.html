<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-drift</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { display: ['Archivo','sans-serif'], body: ['Inter','sans-serif'] },
      colors: { ink: '#09090B', brand: '#0339f8', navy: '#0B1F4A' }
    }}}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="../../assets/ms-icon-256x256.png" rel="shortcut icon" type="image/x-icon" />
  <script src="/kurs/auth.js?v=2"></script>
  <style>body{font-family:'Inter',sans-serif;background:#FAFAFA;color:#09090B}.font-display{font-family:'Archivo',sans-serif}
  .dot-grid{background-image:radial-gradient(circle,#d4d4d8 1px,transparent 1px);background-size:24px 24px}</style>
</head>
<body>
  <script>
    // Port: uten ai-drift-tilgang → send til lås-opp-siden.
    // Sjekk fersk tilgang mot serveren først, i tilfelle den ble gitt etter siste innlogging.
    (async function () {
      if (window.kursRefreshEntitlements) { await window.kursRefreshEntitlements(); }
      if (!window.kursHarTilgang || !window.kursHarTilgang('ai-drift')) {
        window.location.replace('/kurs/ai-drift/las-opp/');
      }
    })();
  </script>

  <header class="dot-grid border-b border-zinc-100">
    <div class="max-w-5xl mx-auto px-6 pt-16 pb-14">
      <a href="/kurs/" class="text-sm font-medium text-zinc-500 hover:text-blue-600">← Tilbake til kurset</a>
      <p class="text-xs font-semibold tracking-widest uppercase text-blue-600 mt-8 mb-3">Premium-tillegg</p>
      <h1 class="font-display font-extrabold text-4xl md:text-5xl tracking-[-0.03em] text-ink">Drift med AI</h1>
      <p class="text-zinc-600 mt-4 max-w-2xl">Stegvise oppskrifter for å spare tid og gi kundene mer verdi, på tvers av bransjer.</p>
    </div>
  </header>

  <section class="max-w-5xl mx-auto px-6 py-14">
    <div id="modulGrid" class="grid md:grid-cols-2 gap-5"></div>
  </section>

  <script src="/kurs/ai-drift/moduler.js?v=20260818"></script>
  <script>
    var grid = document.getElementById('modulGrid');
    (window.AI_DRIFT_MODULER || []).forEach(function (m, i) {
      var a = document.createElement('a');
      a.href = '/kurs/ai-drift/vis/?modul=' + encodeURIComponent(m.slug);
      a.className = 'block bg-white border border-zinc-200 rounded-2xl p-6 hover:border-blue-600 hover:-translate-y-0.5 transition';
      a.innerHTML =
        '<div class="flex items-center gap-3 mb-3">' +
          '<span class="text-xs text-zinc-400 font-mono">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span class="ml-auto text-xs text-zinc-400">' + (m.min || 6) + ' min</span>' +
        '</div>' +
        '<h3 class="font-display font-bold text-xl text-ink mb-2"></h3>' +
        '<p class="text-sm text-zinc-600" data-desc></p>' +
        (m.teknologi ? '<p class="mt-2 text-xs text-zinc-400" data-tek></p>' : '');
      a.querySelector('h3').textContent = m.tittel;
      a.querySelector('[data-desc]').textContent = m.desc;
      if (m.teknologi) { a.querySelector('[data-tek]').textContent = 'Teknologi: ' + m.teknologi; }
      grid.appendChild(a);
    });
  </script>
</body>
</html>
