<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velg nytt passord: DM Salg</title>
  <meta name="robots" content="noindex, nofollow" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { display: ['Archivo', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        colors: { ink: '#09090B', brand: '#0339f8', mute: '#52525B', line: '#E4E4E7' }
      } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="../../assets/ms-icon-256x256.png" rel="shortcut icon" type="image/x-icon" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #FAFAFA; color: #09090B; }
    .font-display { font-family: 'Archivo', sans-serif; }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid #0339f8; outline-offset: 2px; border-radius: 8px;
    }
    .dot-grid { background-image: radial-gradient(circle,#d4d4d8 1px,transparent 1px); background-size: 24px 24px; }
  </style>
</head>
<body class="min-h-dvh flex flex-col items-center justify-center px-6 py-12 dot-grid">

  <main class="w-full max-w-sm">
    <div class="mb-7 text-center">
      <p class="font-display font-extrabold text-xl tracking-[-0.02em]">
        DM <span class="text-brand">Salg</span>
      </p>
    </div>

    <div class="bg-white border border-line rounded-2xl p-7 sm:p-8">
      <h1 class="font-display font-extrabold text-2xl tracking-[-0.02em] mb-2">Velg nytt passord</h1>
      <p class="text-mute text-[15px] mb-7 leading-relaxed" id="hjelp">Skriv inn passordet du vil bruke.</p>

      <form id="form" class="space-y-4" novalidate>
        <div>
          <label for="pw1" class="block text-sm font-medium mb-1.5">Nytt passord</label>
          <div class="relative">
            <input type="password" id="pw1" autocomplete="new-password"
                   class="w-full border border-zinc-300 rounded-xl pl-4 pr-24 min-h-[48px] text-[15px] focus:border-brand" />
            <button type="button" id="vis"
                    class="absolute right-1.5 top-1/2 -translate-y-1/2 h-10 px-3 rounded-lg text-sm text-mute hover:text-ink hover:bg-zinc-100 transition-colors">Vis</button>
          </div>
          <p class="text-[13px] text-mute mt-1.5">Minst 8 tegn.</p>
        </div>
        <div>
          <label for="pw2" class="block text-sm font-medium mb-1.5">Gjenta passordet</label>
          <input type="password" id="pw2" autocomplete="new-password"
                 class="w-full border border-zinc-300 rounded-xl px-4 min-h-[48px] text-[15px] focus:border-brand" />
        </div>

        <p id="feil" class="hidden bg-red-50 border border-red-200 text-red-800 text-sm rounded-lg px-4 py-3" role="alert"></p>

        <button type="submit" id="send"
                class="w-full bg-brand text-white font-semibold min-h-[48px] rounded-xl hover:bg-blue-700 transition-colors text-[15px]">
          Lagre og logg inn
        </button>
      </form>
    </div>
  </main>

<script>
  var ENDEPUNKT = 'ERSTATT_MED_WEB_APP_URL';
  var TOKEN_KEY = 'selger_auth_v1';

  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var epost = (params.get('epost') || '').toLowerCase().trim();

  if (!token || !epost) {
    document.getElementById('form').classList.add('hidden');
    document.getElementById('hjelp').innerHTML =
      'Lenken mangler noe. <a href="/selger/glemt-passord/" class="text-brand underline">Be om en ny.</a>';
  }

  async function pbkdf2(passord, salt) {
    var enc = new TextEncoder();
    var n = await crypto.subtle.importKey('raw', enc.encode(passord), 'PBKDF2', false, ['deriveBits']);
    var b = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' }, n, 256);
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  }

  var pw1 = document.getElementById('pw1');
  document.getElementById('vis').addEventListener('click', function () {
    var vis = pw1.type === 'password';
    pw1.type = vis ? 'text' : 'password';
    this.textContent = vis ? 'Skjul' : 'Vis';
    pw1.focus();
  });

  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var knapp = document.getElementById('send');
    var feil = document.getElementById('feil');
    var p1 = pw1.value, p2 = document.getElementById('pw2').value;
    feil.classList.add('hidden');

    if (p1.length < 8) {
      feil.textContent = 'Passordet må være minst 8 tegn.';
      feil.classList.remove('hidden'); pw1.focus(); return;
    }
    if (p1 !== p2) {
      feil.textContent = 'De to passordene er ikke like.';
      feil.classList.remove('hidden'); document.getElementById('pw2').focus(); return;
    }

    knapp.disabled = true;
    knapp.textContent = 'Lagrer …';
    try {
      var hash = await pbkdf2(p1, epost);
      var res = await fetch(ENDEPUNKT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ handling: 'nullstill', token: token, epost: epost, hash: hash })
      });
      var data = await res.json();

      if (data.ok) {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({
          epost: data.epost, navn: data.navn, token: data.token, loginAt: Date.now()
        }));
        window.location.replace('/selger/');
        return;
      }

      feil.textContent = data.melding || 'Lenken virker ikke lenger. Be om en ny.';
      feil.classList.remove('hidden');
      knapp.disabled = false;
      knapp.textContent = 'Lagre og logg inn';
    } catch (err) {
      feil.textContent = 'Fikk ikke kontakt. Sjekk nettet og prøv igjen.';
      feil.classList.remove('hidden');
      knapp.disabled = false;
      knapp.textContent = 'Lagre og logg inn';
    }
  });
</script>

</body>
</html>
