<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logg inn: Dietrichs Salg</title>
  <meta name="robots" content="noindex, nofollow" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { display: ['Archivo', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        colors: { ink: '#09090B', brand: '#0339f8', mute: '#52525B', line: '#E4E4E7' }
      } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="../../assets/ms-icon-256x256.png" rel="shortcut icon" type="image/x-icon" />

  <style>
    body { font-family: 'Inter', sans-serif; background: #FAFAFA; color: #09090B; }
    .font-display { font-family: 'Archivo', sans-serif; }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid #0339f8; outline-offset: 2px; border-radius: 8px;
    }
    .dot-grid {
      background-image: radial-gradient(circle, #d4d4d8 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="min-h-dvh flex flex-col items-center justify-center px-6 py-12 dot-grid">

  <main class="w-full max-w-sm">

    <div class="mb-7 text-center">
      <p class="font-display font-extrabold text-xl tracking-[-0.02em]">
        Dietrichs <span class="text-brand">Salg</span>
      </p>
    </div>

    <div class="bg-white border border-line rounded-2xl p-7 sm:p-8">
      <h1 class="font-display font-extrabold text-2xl tracking-[-0.02em] mb-2">
        Logg inn
      </h1>
      <p class="text-mute text-[15px] mb-7 leading-relaxed">
        Her ligger ringelista og tallene dine.
      </p>

      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label for="epost" class="block text-sm font-medium mb-1.5">E-post</label>
          <input type="email" id="epost" inputmode="email" autocomplete="email"
                 placeholder="fornavn@dmarketing.no" autofocus
                 class="w-full border border-zinc-300 rounded-xl px-4 min-h-[48px] text-[15px]
                        focus:border-brand" />
        </div>

        <div>
          <label for="passord" class="block text-sm font-medium mb-1.5">Passord</label>
          <div class="relative">
            <input type="password" id="passord" autocomplete="current-password"
                   class="w-full border border-zinc-300 rounded-xl pl-4 pr-24 min-h-[48px] text-[15px]
                          focus:border-brand" />
            <button type="button" id="visPassord"
                    class="absolute right-1.5 top-1/2 -translate-y-1/2 h-10 px-3 rounded-lg
                           text-sm text-mute hover:text-ink hover:bg-zinc-100 transition-colors">
              Vis
            </button>
          </div>
        </div>

        <p id="feil" class="hidden bg-red-50 border border-red-200 text-red-800 text-sm
                            rounded-lg px-4 py-3" role="alert" aria-live="assertive"></p>

        <button type="submit" id="send"
                class="w-full bg-brand text-white font-semibold min-h-[48px] rounded-xl
                       hover:bg-blue-700 active:bg-blue-800 transition-colors text-[15px]">
          Logg inn
        </button>
      </form>
    </div>

    <p class="mt-6 text-[13px] text-mute leading-relaxed text-center">
      Får du ikke logget inn? Ring Adrian på
      <a href="tel:+4793439278" class="underline hover:text-ink">934 39 278</a>.
    </p>

  </main>

<script>
  var ENDEPUNKT = 'ERSTATT_MED_WEB_APP_URL';
  var TOKEN_KEY = 'selger_auth_v1';

  // samme utledning som kurset bruker, e-posten er salt
  async function pbkdf2(passord, salt) {
    var enc = new TextEncoder();
    var noekkel = await crypto.subtle.importKey('raw', enc.encode(passord), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' },
      noekkel, 256);
    return Array.from(new Uint8Array(bits))
      .map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  var pw = document.getElementById('passord');
  document.getElementById('visPassord').addEventListener('click', function () {
    var vis = pw.type === 'password';
    pw.type = vis ? 'text' : 'password';
    this.textContent = vis ? 'Skjul' : 'Vis';
    pw.focus();
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var knapp = document.getElementById('send');
    var feil = document.getElementById('feil');
    var epost = document.getElementById('epost').value.toLowerCase().trim();
    var passord = pw.value;

    feil.classList.add('hidden');

    if (!epost) {
      feil.textContent = 'Skriv inn e-postadressen din.';
      feil.classList.remove('hidden');
      document.getElementById('epost').focus();
      return;
    }
    if (!passord) {
      feil.textContent = 'Skriv inn passordet ditt.';
      feil.classList.remove('hidden');
      pw.focus();
      return;
    }

    knapp.disabled = true;
    knapp.textContent = 'Sjekker …';

    try {
      var hash = await pbkdf2(passord, epost);
      var res = await fetch(ENDEPUNKT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ handling: 'login', epost: epost, hash: hash })
      });
      var data = await res.json();

      if (data.ok) {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({
          epost: data.epost, navn: data.navn, token: data.token, loginAt: Date.now()
        }));
        window.location.replace('/selger/');
        return;
      }

      feil.textContent = data.melding || 'Feil e-post eller passord.';
      feil.classList.remove('hidden');
      if (data.error === 'feil_passord') { pw.value = ''; pw.focus(); }
      else { document.getElementById('epost').focus(); }
    } catch (err) {
      feil.textContent = 'Fikk ikke kontakt. Sjekk nettet og prøv igjen.';
      feil.classList.remove('hidden');
    }

    knapp.disabled = false;
    knapp.textContent = 'Logg inn';
  });
</script>

</body>
</html>
