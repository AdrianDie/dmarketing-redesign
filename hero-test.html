<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero bakgrunn – test</title>
<style>
  *{margin:0;box-sizing:border-box;}
  body{background:#fff;padding:40px;font-family:system-ui,sans-serif;}

  /* ── Hero ──────────────────────────────────────── */
  .hero{
    position:relative;
    overflow:hidden;                 /* clips the orbs perfectly */
    border-radius:26px;
    height:651px;
    /* base gradient – the deep cobalt field */
    background:
      radial-gradient(120% 120% at 30% 18%, #1d44d6 0%, #0a1f8c 55%, #060f4d 100%);
    isolation:isolate;
  }

  /* Soft drifting "orbs" – soft edges come from the radial gradient
     itself, NOT from filter:blur, so overflow:hidden clips them with
     perfectly rounded corners. */
  .orb{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    will-change:transform;
  }
  .orb-1{
    width:60%;aspect-ratio:1;
    top:-15%;left:-8%;
    background:radial-gradient(circle at 50% 50%, rgba(70,110,255,.85) 0%, rgba(70,110,255,0) 65%);
    animation:drift1 18s ease-in-out infinite alternate;
  }
  .orb-2{
    width:55%;aspect-ratio:1;
    bottom:-20%;right:-5%;
    background:radial-gradient(circle at 50% 50%, rgba(40,80,230,.7) 0%, rgba(40,80,230,0) 65%);
    animation:drift2 22s ease-in-out infinite alternate;
  }
  .orb-3{
    width:45%;aspect-ratio:1;
    bottom:10%;left:18%;
    background:radial-gradient(circle at 50% 50%, rgba(20,40,150,.6) 0%, rgba(20,40,150,0) 65%);
    animation:drift3 26s ease-in-out infinite alternate;
  }
  @keyframes drift1{from{transform:translate(0,0) scale(1);}to{transform:translate(12%,8%) scale(1.15);}}
  @keyframes drift2{from{transform:translate(0,0) scale(1);}to{transform:translate(-10%,-6%) scale(1.1);}}
  @keyframes drift3{from{transform:translate(0,0) scale(1);}to{transform:translate(8%,-10%) scale(1.2);}}
  @media(prefers-reduced-motion:reduce){.orb{animation:none;}}

  .content{
    position:relative;z-index:2;
    padding-top:150px;text-align:center;color:#fff;
  }
  .content h1{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .content p{margin-top:18px;font-size:18px;color:rgba(255,255,255,.78);max-width:560px;margin-left:auto;margin-right:auto;}
</style>
</head>
<body>
  <div class="hero">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="content">
      <h1>Vi gjør norske bedrifter mer lønnsomme.</h1>
      <p>Med apputvikling og AI hjelper vi norske bedrifter å kutte kostnader, effektivisere prosesser og bygge verktøy som faktisk skaper verdi.</p>
    </div>
  </div>
</body>
</html>
