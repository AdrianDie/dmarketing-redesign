<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero røyk – test</title>
<style>
  *{margin:0;box-sizing:border-box;}
  body{background:#fff;padding:40px;font-family:system-ui,sans-serif;}
  .hero{
    position:relative;overflow:hidden;border-radius:26px;height:651px;
    background:#0a1f8c;transform:translateZ(0);isolation:isolate;
  }
  /* canvas sits exactly on the hero box (inset:0) so overflow:hidden +
     border-radius clip it perfectly — no blur filter, no corner escape. */
  .dm-smoke-canvas{position:absolute;top:-40px;left:-40px;width:calc(100% + 80px);height:calc(100% + 80px);display:block;pointer-events:none;filter:blur(18px);}
  .content{position:relative;z-index:2;padding-top:150px;text-align:center;color:#fff;}
  .content h1{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .content p{margin-top:18px;font-size:18px;color:rgba(255,255,255,.78);max-width:560px;margin:18px auto 0;}
</style>
</head>
<body>
  <div class="hero">
    <canvas class="dm-smoke-canvas" aria-hidden="true"></canvas>
    <div class="content">
      <h1>Vi gjør norske bedrifter mer lønnsomme.</h1>
      <p>Med apputvikling og AI hjelper vi norske bedrifter å kutte kostnader, effektivisere prosesser og bygge verktøy som faktisk skaper verdi.</p>
    </div>
  </div>

<script>
(function(){
  var c=document.querySelector(".dm-smoke-canvas");if(!c)return;
  var gl=c.getContext("webgl",{alpha:false,antialias:false,depth:false,powerPreference:"low-power"})||c.getContext("experimental-webgl");
  if(!gl){c.style.background="radial-gradient(125% 125% at 28% 16%,#1d44d6,#0a1f8c 55%,#060f4d)";return;}
  var V="attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}";
  var F=[
   "precision highp float;",
   "uniform vec2 uRes;uniform float uTime;uniform vec2 uSeed;",
   "float hash(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}",
   "float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);",
     "float a=hash(i),b=hash(i+vec2(1.0,0.0)),c=hash(i+vec2(0.0,1.0)),d=hash(i+vec2(1.0,1.0));",
     "return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}",
   "float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=0.5;}return v;}",
   "void main(){",
     "vec2 uv=gl_FragCoord.xy/uRes;",
     "vec2 p=uv*vec2(uRes.x/uRes.y,1.0)*2.6+uSeed;",
     "float t=uTime*0.05;",
     // domain warping → flowing, wispy smoke
     "vec2 q=vec2(fbm(p+vec2(0.0,t)),fbm(p+vec2(3.2,-t*0.8)));",
     "vec2 r=vec2(fbm(p+2.4*q+vec2(1.7,9.2)+0.15*t),fbm(p+2.4*q+vec2(8.3,2.8)-0.13*t));",
     "float f=fbm(p+2.6*r);",
     "f=smoothstep(0.05,0.95,f);",
     // wisp contrast
     "float wisp=smoothstep(0.35,0.85,f);",
     // blue palette
     "vec3 deep=vec3(0.020,0.055,0.28);",   // dark navy
     "vec3 cob =vec3(0.106,0.204,1.0);",    // brand cobalt #1B34FF
     "vec3 hi  =vec3(0.62,0.72,1.0);",      // light highlight
     "vec3 col=mix(deep,cob,smoothstep(0.15,0.7,f));",
     "col=mix(col,hi,wisp*0.55);",
     // subtle vertical lift
     "col+=vec3(0.01,0.02,0.05)*(1.0-uv.y);",
     "gl_FragColor=vec4(col,1.0);",
   "}"
  ].join("");
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
  var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.linkProgram(pr);gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var lp=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  var uR=gl.getUniformLocation(pr,"uRes"),uT=gl.getUniformLocation(pr,"uTime"),uS=gl.getUniformLocation(pr,"uSeed");
  var sx=Math.random()*40,sy=Math.random()*40;
  function rs(){var d=Math.min(window.devicePixelRatio||1,1.5),w=c.clientWidth,h=c.clientHeight;c.width=Math.max(1,Math.floor(w*d));c.height=Math.max(1,Math.floor(h*d));gl.viewport(0,0,c.width,c.height);}
  rs();window.addEventListener("resize",rs);
  var s0=null;function fr(ts){if(s0===null)s0=ts;var e=(ts-s0)/1000.0;gl.uniform2f(uR,c.width,c.height);gl.uniform1f(uT,e);gl.uniform2f(uS,sx,sy);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(fr);}
  requestAnimationFrame(fr);
})();
</script>
</body>
</html>
