<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero bakgrunn – test</title>
<style>
  *{margin:0;box-sizing:border-box;}
  body{background:#fff;padding:40px;font-family:system-ui,sans-serif;}

  .hero{
    position:relative;
    overflow:hidden;
    border-radius:26px;
    height:651px;
    background:radial-gradient(125% 125% at 28% 16%, #1d44d6 0%, #0a1f8c 55%, #060f4d 100%);
    transform:translateZ(0);   /* own compositing layer → clips blurred children to rounded corners */
    isolation:isolate;
  }

  /* Smoke layer: all blobs live here, blurred together for a soft, diffuse look.
     overflow:hidden lets the blobs wander well past the edges. */
  .dm-smoke{
    position:absolute;
    inset:-10%;                /* let blobs drift in/out of frame */
    overflow:hidden;
    filter:blur(55px);
    pointer-events:none;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    mix-blend-mode:screen;     /* blobs add light, blend like smoke */
    will-change:transform;
  }
  .b1{width:46%;aspect-ratio:1;top:2%;left:-2%;
    background:radial-gradient(circle at 50% 50%, rgba(78,118,255,.9), rgba(78,118,255,0) 70%);
    animation:smoke1 34s ease-in-out infinite;}
  .b2{width:38%;aspect-ratio:1;top:30%;left:55%;
    background:radial-gradient(circle at 50% 50%, rgba(40,80,235,.85), rgba(40,80,235,0) 70%);
    animation:smoke2 41s ease-in-out infinite;}
  .b3{width:52%;aspect-ratio:1;top:45%;left:8%;
    background:radial-gradient(circle at 50% 50%, rgba(120,150,255,.6), rgba(120,150,255,0) 70%);
    animation:smoke3 47s ease-in-out infinite;}
  .b4{width:34%;aspect-ratio:1;top:-8%;left:62%;
    background:radial-gradient(circle at 50% 50%, rgba(30,60,200,.8), rgba(30,60,200,0) 70%);
    animation:smoke4 38s ease-in-out infinite;}
  .b5{width:42%;aspect-ratio:1;top:55%;left:60%;
    background:radial-gradient(circle at 50% 50%, rgba(60,100,245,.7), rgba(60,100,245,0) 70%);
    animation:smoke5 52s ease-in-out infinite;}
  .b6{width:30%;aspect-ratio:1;top:20%;left:25%;
    background:radial-gradient(circle at 50% 50%, rgba(150,180,255,.5), rgba(150,180,255,0) 70%);
    animation:smoke6 44s ease-in-out infinite;}

  /* Wandering multi-step paths, each different → no synced "two circles" feel */
  @keyframes smoke1{
    0%{transform:translate(0,0) scale(1);}
    25%{transform:translate(22%,14%) scale(1.25);}
    50%{transform:translate(8%,30%) scale(.95);}
    75%{transform:translate(30%,6%) scale(1.15);}
    100%{transform:translate(0,0) scale(1);}}
  @keyframes smoke2{
    0%{transform:translate(0,0) scale(1);}
    30%{transform:translate(-26%,18%) scale(1.2);}
    60%{transform:translate(-10%,-14%) scale(.9);}
    100%{transform:translate(0,0) scale(1);}}
  @keyframes smoke3{
    0%{transform:translate(0,0) scale(1);}
    33%{transform:translate(18%,-16%) scale(1.1);}
    66%{transform:translate(-14%,-8%) scale(1.3);}
    100%{transform:translate(0,0) scale(1);}}
  @keyframes smoke4{
    0%{transform:translate(0,0) scale(1);}
    40%{transform:translate(-20%,26%) scale(1.25);}
    70%{transform:translate(12%,12%) scale(1);}
    100%{transform:translate(0,0) scale(1);}}
  @keyframes smoke5{
    0%{transform:translate(0,0) scale(1);}
    35%{transform:translate(-22%,-20%) scale(1.15);}
    65%{transform:translate(-32%,8%) scale(.95);}
    100%{transform:translate(0,0) scale(1);}}
  @keyframes smoke6{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(34%,22%) scale(1.4);}
    100%{transform:translate(0,0) scale(1);}}
  @media(prefers-reduced-motion:reduce){.blob{animation:none;}}

  .content{
    position:relative;z-index:2;
    padding-top:150px;text-align:center;color:#fff;
  }
  .content h1{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .content p{margin-top:18px;font-size:18px;color:rgba(255,255,255,.78);max-width:560px;margin-left:auto;margin-right:auto;}
</style>
</head>
<body>
  <div class="hero">
    <div class="dm-smoke" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
      <div class="blob b5"></div>
      <div class="blob b6"></div>
    </div>
    <div class="content">
      <h1>Vi gjør norske bedrifter mer lønnsomme.</h1>
      <p>Med apputvikling og AI hjelper vi norske bedrifter å kutte kostnader, effektivisere prosesser og bygge verktøy som faktisk skaper verdi.</p>
    </div>
  </div>
</body>
</html>
