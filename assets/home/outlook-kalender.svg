<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1784D9"/>
      <stop offset="100%" stop-color="#0A63C9"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="9" fill="url(#bg)"/>
  <!-- White calendar body -->
  <rect x="9" y="17" width="30" height="24" rx="3" fill="white"/>
  <!-- Blue calendar header -->
  <rect x="9" y="17" width="30" height="9" rx="3" fill="#0078D4"/>
  <rect x="9" y="23" width="30" height="3" fill="#0078D4"/>
  <!-- Ring holes -->
